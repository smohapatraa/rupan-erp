[theme]
primaryColor = "#2e7d32"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4fbf4"
textColor = "#262730"
font = "sans serif"

[client]
toolbarMode = "developer"  # <--- Change "minimal" to "developer"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
