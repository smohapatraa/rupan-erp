[theme]
# Matches your Rupan Renewables branding (Green & Orange)
primaryColor = "#2e7d32"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4fbf4"
textColor = "#262730"
font = "sans serif"

[client]
# Hides the "Fork" button, GitHub icon, and 3-dot menu
toolbarMode = "minimal"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
